<!DOCTYPE html>
<html>
    <head>
        <title>Lab 4</title>

         <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
           integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
           crossorigin=""/>

         <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
           integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
           crossorigin=""></script>

<script type="text/javascript" src="data.js"></script>
        
<style type="text/css">
  html, body { margin: 0; padding: 0; height: 100%; }
  #map { min-height: 100%; }
</style>
        
<style>
  /* Optional: adjust the values below to change the appearance of the legend */
  .legend {
      padding: 6px 8px;
      line-height: 18px;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      border-radius: 5px;
  }

  /* Optional: adjust the values below to change the appearance of the legend color boxes */
  .legend i {
      width: 18px;
      height: 18px;
      float: left;
      margin-right: 8px;
      opacity: 0.7;
  }
</style>
        
    </head>

    <body>
        <div id="map"></div>

        <script type="text/javascript">

          var map = L.map('map', {
              center: [51.48,-0.07],
              zoom: 10
          });

var terrain = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
   attribution: 'Tiles © Esri — Esri, DeLorme, NAVTEQ, TomTom',
   maxZoom: 19,
   minZoom: 0
}).addTo(map);

var imagery = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles © Esri — Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
});

            
function getColor(value) {
    return value > 12500 ? '#08519c':
           value > 8000  ? '#3182bd':
           value > 6000  ? '#6baed6':
           value > 2000  ? '#bdd7e7':
                         '#eff3ff';
}

function style(feature){
    return {
        fillColor: getColor(feature.properties.PopDen),   // pop_den is the field name for the population density data
        weight: 2,
        opacity: 1,
        color: 'white',
		dashArray: '5, 5',    // <--- Adds the dashed line (dash, gap in pixels)
        fillOpacity: 0.9
    };
}
            
function highlightFeature(e) {
    // Get access to the feature that was hovered through e.target
    var feature = e.target;

    // Set a thick grey border on the feature as mouseover effect
    // Adjust the values below to change the highlighting styles of features on mouseover
    // Check out https://leafletjs.com/reference.html#path for more options for changing style
    feature.setStyle({
        weight: 8,
        color: '#ffffff',
        fillOpacity: 0.7
    });
        
var boroughs = L.geoJson(data, {style:style}).addTo(map);

var nasa = L.tileLayer.wms('https://gibs.earthdata.nasa.gov/wms/epsg3857/best/wms.cgi?', {
    layers: 'MERRA2_2m_Air_Temperature_Assimilated_Monthly',
    format: 'image/png',
    transparent: true,
    opacity: 0.6,
    attribution: 'Imagery courtesy of NASA EOSDIS GIBS'
}).addTo(map);

       // Bring the highlighted feature to front so that the border doesn’t clash with nearby states
    // But not for IE, Opera or Edge, since they have problems doing bringToFront on mouseover
    if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) {
        feature.bringToFront();
    }
}

var basemaps = {
    "World Terrain": terrain,
    "Satellite Imagery": imagery
};

var overlaymaps = {
    "London Boroughs": boroughs,
    "NASA Imagery": nasa
};
            
L.control.layers(basemaps, overlaymaps).addTo(map);
            
// Removing the legend when the layer is removed
map.on('overlayremove', function(eventLayer){
  if (eventLayer.name == 'London Boroughs'){ // We use the key/display name to refer to the layer
    map.removeControl(legend); // legend is the variable name of the layer legend
  }
});

// Adding the legend when the layer is added
map.on('overlayadd', function(eventLayer){
  if (eventLayer.name == 'London Boroughs'){
    legend.addTo(map);
  }
});
            
var legend = L.control({position: 'bottomright'}); // Try the other three corners if you like.

legend.onAdd = function (map) {

    var div = L.DomUtil.create('div', 'legend'),
        grades = [0, 32, 53, 87, 139]; // The break values that define the intervals, note we begin from 0 here

    div.innerHTML = '<b>Population Density <br> 2011 <br></b>'; // The legend title, written in HTML

    // Loop through the classes and generate a label with a color box for each interval.
    // If you are creating a choropleth map, you DO NOT need to change the lines below.
    for (var i = 0; i < grades.length; i++) {
        div.innerHTML +=
        '<i style="background:' + getColor(grades[i] + 1) + '"></i>' +
        grades[i] + (grades[i + 1] ? '&ndash;' + grades[i + 1] + '<br>' : '+');
    }

    return div;
};

legend.addTo(map);
            
        </script>
   </body>
</html>
